name: 06-contexts
run-name: 06-contexts | DEBUG - ${{ inputs.debug }}

on:
  push:
  workflow_dispatch:
    inputs:
        debug: 
            type: boolean
            default: false

jobs:
    echo-data:
        runs-on: ubuntu-latest
        env:
            my_env: "job"
        

        steps:
            - name: Show data from github context
              run:  |
                echo "Event name is ${{ github.event_name }}"
                echo "ref is ${{ github.ref }}"
                echo " sha is ${{ github.sha }}"
                echo " actor is ${{ github.actor }}"
                echo " workflow is ${{ github.workflow }}"
                echo "run_id is ${{ github.run_id }}"
                echo "run_number is ${{ github.run_number }}"

            - name: Print varibales
              run:  echo " my personal variable is ${{ vars.my_ar }}"

            - name: print env variables
              env:
                my_envs: "step"
              run: |
                   echo "my_envs is ${{ env.my_envs }}"
            