name: 17-3 custom-action-docker

on: 
    workflow_dispatch:
        inputs:
            url:
                type: choice
                options:
                    - "https://google.com"
                    - "https://githdgfgsub.com"
                    - "ysgfgsoutube"
                
            max_trails:
                type: string
                default: "10"
            delay:
                type: string
                default: "5"


jobs:
    ping-url:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            
            - name: Ping URL
              uses: ./.github/actions/docker-ping-url
              with:
                url: ${{ inputs.url }}
                max_trails: ${{ inputs.max_trails }}
                delay: ${{ inputs.delay }}
