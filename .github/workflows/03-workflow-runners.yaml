name: 03-workflow-runners

on:
  push 

jobs:
    ubuntu-echo:
        runs-on: ubuntu-latest
        steps:
            - name: Show OS
              run: echo "i am running on $RUNNER_OS"

    windows-echo:
       runs-on: windows-latest
       steps:
         - name: Show OS
           shell: bash
           run: echo "i am running on $RUNNER_OS"
